name: Generate harness

on:
  push:
    branches:
      - master
    paths:
      - 'harness/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate and test harness
        run: bash harness/scripts/generate.sh --check-root

      - name: Push to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf --quiet .
          git add -f sample_harness/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: generate harness from harness/config.json and harness/lang.json"
          git push origin dist --force
